spring.application.name=salespilot

# Connexion a PostgreSQL (Docker, port 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/salespilot
spring.datasource.username=salespilot
spring.datasource.password=salespilot

# Flyway cree les tables, Hibernate verifie seulement
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Pagination : jamais plus de 100 elements par page
spring.data.web.pageable.max-page-size=100
# Taille maximale des fichiers importes
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Laisse Tomcat lire la requete trop grosse pour pouvoir repondre 413 proprement
server.tomcat.max-swallow-size=20MB
# Swagger : groupes par ordre alphabetique (Imports, Indicateurs, Rapports), endpoints tries par methode
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method